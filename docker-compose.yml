services:
  db:
    image: postgres:16-alpine
    container_name: swapstay_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: swapstay
      POSTGRES_USER: swapstay
      POSTGRES_PASSWORD: swapstay
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swapstay"]
      interval: 5s
      timeout: 3s
      retries: 5

  django:
    image: python:3.12-slim
    container_name: swapstay_django
    working_dir: /app
    restart: unless-stopped
    command: >
      sh -c "pip install --no-cache-dir -r requirements-django.txt &&
      python manage.py migrate &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./:/app
    environment:
      ENV_TYPE: development
      DB_ENGINE: postgres
      DB_NAME: swapstay
      DB_USER: swapstay
      DB_PASSWORD: swapstay
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: localhost,127.0.0.1,django,nginx
    depends_on:
      db:
        condition: service_healthy

  flask:
    build:
      context: ./flask_service
      dockerfile: Dockerfile
    container_name: swapstay_flask
    restart: unless-stopped
    environment:
      FLASK_ENV: production
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    container_name: swapstay_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django
      - flask

volumes:
  postgres_data: