events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── Upstream: Django ──────────────────────────────────────────────────────
    upstream django_upstream {
        server django:8000;
    }

    # ── Upstream: Flask μS 1 — Cotizaciones ──────────────────────────────────
    upstream flask_cotizaciones {
        server flask:5000;
    }

    # ── Upstream: Flask μS 2 — Notificaciones ────────────────────────────────
    upstream flask_notificaciones {
        server flask-notificaciones:5002;
    }

    # ── Upstream: Flask μS 3 — Disponibilidad ────────────────────────────────
    upstream flask_disponibilidad {
        server flask-disponibilidad:5003;
    }

    # ── Upstream: Flask μS 4 — Validaciones ──────────────────────────────────
    upstream flask_validaciones {
        server flask-validaciones:5004;
    }

    # ── Upstream: Flask μS 5 — Moneda ────────────────────────────────────────
    upstream flask_moneda {
        server flask-moneda:5005;
    }

    # ── Upstream: Flask μS 6 — Geolocalización ───────────────────────────────
    upstream flask_geolocalizacion {
        server flask-geolocalizacion:5006;
    }

    server {
        listen 80;
        server_name _;

        # ── Health check propio de Nginx ──────────────────────────────────────
        location = /health {
            return 200 'nginx-ok';
            add_header Content-Type text/plain;
        }

        # ── Archivos estáticos Django ─────────────────────────────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── API v1 → Django DRF ───────────────────────────────────────────────
        location /api/v1/ {
            proxy_pass http://django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── μS 1: Cotizaciones (/api/v2/cotizaciones/) ────────────────────────
        location /api/v2/cotizaciones {
            proxy_pass http://flask_cotizaciones;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Ruta legacy del μS 1
        location /api/v2/funcionalidad {
            proxy_pass http://flask_cotizaciones;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── μS 2: Notificaciones (/api/v2/notificaciones/) ───────────────────
        location /api/v2/notificaciones/ {
            proxy_pass http://flask_notificaciones;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── μS 3: Disponibilidad (/api/v2/disponibilidad/) ───────────────────
        location /api/v2/disponibilidad/ {
            proxy_pass http://flask_disponibilidad;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── μS 4: Validaciones (/api/v2/validaciones/) ───────────────────────
        location /api/v2/validaciones/ {
            proxy_pass http://flask_validaciones;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── μS 5: Moneda (/api/v2/moneda/) ───────────────────────────────────
        location /api/v2/moneda/ {
            proxy_pass http://flask_moneda;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── μS 6: Geolocalización (/api/v2/geolocalizacion/) ─────────────────
        location /api/v2/geolocalizacion/ {
            proxy_pass http://flask_geolocalizacion;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Todo lo demás → Django (frontend + admin) ─────────────────────────
        location / {
            proxy_pass http://django_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
